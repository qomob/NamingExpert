# 命名项目注册表模板
# 用途：跨会话持久化全部命名项目。文件通道写入 skill 根目录 registry.yaml；
#       对话通道（无文件 I/O 的 agent）在回复末尾输出本内容供用户保存，下次粘贴续接
# 状态派生规则：final 非空 = 已定稿；shortlist 为空 = 尚未交付方案；否则 = 迭代中
# 排序约定：projects 索引 0 = 最近活跃；每次写入把该项目条目移到索引 0

# ===== 以下字段由 skill 在需求确认 / 方案交付 / 迭代 / 定稿后自动填充 =====

schema_version: 1

# 跨项目全局偏好（所有命名项目共用，新项目生成前先读，避免重复踩已知的坑）
global_preferences:
  likes: []       # 用户偏好的风格方向（如"温暖市井"）
  dislikes: []    # 用户讨厌的方向（如"冷淡疏离"）

# 项目列表（索引 0 = 最近活跃）
projects:
  - id: ""            # 命名对象标识（如"咖啡品牌"、"林家宝宝"）
    updated: ""       # 最后更新日期
    round: 0          # 迭代轮数（首轮方案交付后为 0，用户每反馈调整一轮 +1；跨会话累计，上限 3）
    brief:            # 需求画像五维度（续接时直接沿用，仅追问新增约束）
      type: ""        # 企业 / 产品 / 人物 / 宠物 / IP角色 / 网名
      elements: ""    # 行业属性、情感倾向、关键意象
      style: ""       # 风格偏好
      language: ""    # 中文 / 英文 / 中英双语 / 日语 / 多语言混合
      constraints: "" # 字数限制、禁用字/音、避开已有名称、姓氏/辈分
    vetoes: []        # 用户明确否决的名称（本项目永不重新生成，除非用户主动要求重看）
    likes: []         # 本项目认可的方向
    shortlist: []     # 存活方案 {name: 名称, score: 风格匹配度, note: 一句话理由}
    rejected: []      # 淘汰方案 {name: 名称, reason: 淘汰原因}（可应要求重看）
    deliverable: ""   # 交付文档路径（文件通道；output/{项目id}-命名方案.md，方案交付时覆盖更新）
    final: ""         # 最终定稿名称（非空即已定稿）
    finalized: ""     # 定稿日期
